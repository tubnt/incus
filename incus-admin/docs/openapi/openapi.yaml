openapi: 3.0.3
info:
  title: incus-admin API
  description: |
    incus-admin 是基于 Incus 的私有云管理面板。本文档描述 portal（用户面）+ admin（管理员面）的 HTTP API。

    认证：
      - Web UI：oauth2-proxy 透传 X-Forwarded-Email + ProxyAuth middleware
      - API client：Bearer token（POST /portal/api-tokens 创建）

    Step-up：部分敏感 admin 端点需要在 5 分钟内完成 OIDC re-auth；未完成时返 401 with `step_up_required`。

    本 spec 由 incus-admin 内嵌；生产构建时 commit 它即视为发布。当前覆盖核心资源；
    完整 80+ endpoint 通过 swag v1 增量补充（OPS 后续）。
  version: 1.0.0
  contact:
    name: incus-admin
    url: https://vmc.5ok.co
servers:
  - url: https://vmc.5ok.co/api
    description: production
  - url: http://localhost:8080/api
    description: local
security:
  - cookie: []
  - bearer: []
tags:
  - name: vm
    description: 虚拟机生命周期
  - name: firewall
    description: 用户级 / 共享防火墙组
  - name: floating-ip
    description: Floating IP 分配 / 绑定
  - name: snapshot
    description: 实例 snapshot CRUD
  - name: order
    description: 订单与支付
  - name: ssh-key
    description: 用户 SSH 公钥
  - name: alert
    description: PLAN-041 监控告警闭环
  - name: notify
    description: PLAN-041 通知通道
  - name: metrics
    description: Prometheus exposition + 业务指标
  - name: cloud-gateway
    description: |
      PLAN-053 / INFRA-012 cloud-gateway 标准 /v1 适配层。Bearer-only 鉴权，
      独立 token-bucket（默认 100 rpm + burst 30，写操作单独再过 30 burst 桶）。
      错误响应统一 `{"errors":[{"field","reason","message?"}]}`；分页统一
      `?page=&page_size=` + `{"data":[],"page","page_size","pages","total"}`。
      写端点（POST/DELETE/actions）可选 `Idempotency-Key`（16..255 字符，
      `[A-Za-z0-9._-]`）；命中重放时响应头 `Idempotent-Replay: true`，5xx 不
      缓存、2xx/4xx 缓存 24h。POST /v1/instances 返 201 + status=`pending`，
      AI 端需轮询 GET /v1/instances/{id} 直到 status=`running`。DELETE 是
      trash 语义（status=`deleting` + 30s 软删除），同名 GET 在 30s 内仍可见。
paths:
  /health:
    get:
      summary: 健康检查
      description: 返回 dist_hash + 状态。无需鉴权。
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  dist_hash: { type: string, example: a1b2c3d4 }
  /metrics:
    get:
      summary: Prometheus exposition
      description: |
        业务指标 + Go runtime。默认匿名；当 METRICS_BEARER_TOKEN 配置时强制 Bearer。
        指标列表：
          - incusadmin_vms_active{status}
          - incusadmin_orders_pending
          - incusadmin_jobs_failed{kind}
          - incusadmin_alerts_active{kind,severity}
          - incusadmin_balance_total
          - incusadmin_build_info{version,dist_hash,env}
      tags: [metrics]
      security: []
      responses:
        '200':
          description: prometheus exposition
          content:
            text/plain: {}
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/vms:
    get:
      summary: 列出当前用户的 VM
      tags: [vm]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  vms:
                    type: array
                    items: { $ref: '#/components/schemas/VM' }
  /portal/vms/{name}:
    get:
      summary: 获取单台 VM 详情（owner-scoped）
      tags: [vm]
      parameters: [{ $ref: '#/components/parameters/VMName' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  vm: { $ref: '#/components/schemas/VM' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /portal/vms/{name}/snapshots:
    get:
      summary: 列 VM 的 snapshot
      tags: [snapshot]
      parameters:
        - { $ref: '#/components/parameters/VMName' }
        - in: query
          name: cluster
          required: true
          schema: { type: string }
        - in: query
          name: project
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      summary: 创建 snapshot
      tags: [snapshot]
      parameters: [{ $ref: '#/components/parameters/VMName' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster]
              properties:
                cluster: { type: string }
                project: { type: string }
                name: { type: string, description: '默认 snap-YYYYMMDD-HHMMSS' }
      responses:
        '201':
          description: created

  /portal/firewall/groups:
    get:
      summary: 列出当前用户可见的 firewall group（共享 + 私有）
      tags: [firewall]
      responses:
        '200':
          description: ok
    post:
      summary: 创建私有 firewall group
      tags: [firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirewallGroup' }

  /portal/floating-ips:
    get:
      summary: 列出当前用户的 floating IP
      tags: [floating-ip]
      responses:
        '200': { description: ok }
    post:
      summary: 申请新 floating IP
      tags: [floating-ip]

  /portal/orders:
    get:
      summary: 列出当前用户订单
      tags: [order]
      responses:
        '200': { description: ok }
    post:
      summary: 创建订单
      tags: [order]

  /portal/ssh-keys:
    get:
      summary: 列出当前用户 SSH key
      tags: [ssh-key]
    post:
      summary: 添加 SSH key
      tags: [ssh-key]

  # ============ admin: PLAN-041 监控告警闭环 ============
  /admin/notify-channels:
    get:
      summary: 列出通知通道（不返 config）
      tags: [notify]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: '#/components/schemas/NotifyChannel' }
    post:
      summary: 创建通知通道（config 中含的 secret 服务端 AES-256-GCM 加密）
      description: 'step-up gated。kind 取值：dingtalk / feishu / wecom / webhook / smtp。'
      tags: [notify]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyChannelCreate' }
      responses:
        '201': { description: created }
        '401': { $ref: '#/components/responses/StepUpRequired' }

  /admin/notify-channels/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      summary: 更新通道（PUT 替换；config 为空则保留原配置）
      tags: [notify]
      responses:
        '200': { description: ok }
        '401': { $ref: '#/components/responses/StepUpRequired' }
    delete:
      summary: 删除通道
      tags: [notify]
      responses:
        '200': { description: deleted }
        '401': { $ref: '#/components/responses/StepUpRequired' }

  /admin/notify-channels/{id}/test:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      summary: 测试发送一条 demo 通知（同步，立即返回结果）
      tags: [notify]
      responses:
        '200':
          description: '{ status: ok | failed, error?: string }'
        '401': { $ref: '#/components/responses/StepUpRequired' }

  /admin/alert-rules:
    get:
      summary: 列出告警规则
      tags: [alert]
      responses:
        '200': { description: ok }
    post:
      summary: 创建告警规则
      tags: [alert]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleCreate' }

  /admin/alert-rules/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      summary: 获取规则详情
      tags: [alert]
    put:
      summary: 更新规则
      tags: [alert]
    delete:
      summary: 删除规则（builtin=true 行返 400）
      tags: [alert]
      responses:
        '200': { description: deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/StepUpRequired' }

  /admin/alert-rules/{id}/enabled:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    patch:
      summary: 启停规则
      tags: [alert]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }

  /admin/alert-rules/{id}/deliveries:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      summary: 历史送达记录
      tags: [alert]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

  /admin/system-alerts:
    get:
      summary: 列出当前 active 告警
      tags: [alert]

  /admin/system-alerts/{id}/dismiss:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      summary: 手工 dismiss 告警（step-up gated）
      tags: [alert]
      responses:
        '200': { description: ok }
        '401': { $ref: '#/components/responses/StepUpRequired' }

  # ============ cloud-gateway /v1 适配层（PLAN-053 / INFRA-012） ============
  /v1/account:
    get:
      summary: 获取当前 token 持有人账户
      tags: [cloud-gateway]
      security:
        - bearer: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDTO' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '404': { $ref: '#/components/responses/V1NotFound' }
        '429': { $ref: '#/components/responses/V1RateLimited' }
        '500': { $ref: '#/components/responses/V1Internal' }

  /v1/instances:
    get:
      summary: 列出当前用户 VM
      description: trashed / deleted / gone 状态自动过滤；分页 `?page=&page_size=`（默认 25，上限 100）。
      tags: [cloud-gateway]
      security:
        - bearer: []
      parameters:
        - { $ref: '#/components/parameters/V1Page' }
        - { $ref: '#/components/parameters/V1PageSize' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InstanceDTO' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '422': { $ref: '#/components/responses/V1Unprocessable' }
        '429': { $ref: '#/components/responses/V1RateLimited' }
        '500': { $ref: '#/components/responses/V1Internal' }
    post:
      summary: 一键创建 VM（订单流 + auto pay + 异步 provisioning）
      description: |
        同步返 201 + `Location: /v1/instances/{id}`，body 含 InstanceDTO（status=`pending`）。
        AI 端轮询 `GET /v1/instances/{id}` 直到 status=`running`。
        余额不足 → 402 reason=`insufficient_balance`；region 不可用 → 422 reason=`region_unavailable`；
        period 不在 product.period_supported → 422 reason=`unsupported`。
      tags: [cloud-gateway]
      security:
        - bearer: []
      parameters:
        - { $ref: '#/components/parameters/V1IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceCreateRequest' }
      responses:
        '201':
          description: 已创建（异步 provisioning，status=pending）
          headers:
            Location:
              schema: { type: string }
              description: 新 VM 的 GET 路径 `/v1/instances/{id}`
            Idempotent-Replay:
              schema: { type: boolean }
              description: 该响应是否由 Idempotency-Key 命中缓存重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceCreateResponse' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '402': { $ref: '#/components/responses/V1PaymentRequired' }
        '422': { $ref: '#/components/responses/V1Unprocessable' }
        '429': { $ref: '#/components/responses/V1RateLimited' }
        '500': { $ref: '#/components/responses/V1Internal' }

  /v1/instances/{id}:
    parameters:
      - { $ref: '#/components/parameters/V1InstanceID' }
    get:
      summary: 获取单台 VM
      description: 非自己 / trashed / deleted / gone 一律 404（防资源存在性泄露）。
      tags: [cloud-gateway]
      security:
        - bearer: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceDTO' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '404': { $ref: '#/components/responses/V1NotFound' }
        '429': { $ref: '#/components/responses/V1RateLimited' }
    delete:
      summary: trash VM（软删除 + 30s undo 窗口）
      description: |
        202 + status=`deleting`；不接 `?force=true`。30s 内 GET 仍可看到行（status=`deleting`），
        过窗后变 trashed → ListByUser/InstanceByID 一律 404。
      tags: [cloud-gateway]
      security:
        - bearer: []
      parameters:
        - { $ref: '#/components/parameters/V1IdempotencyKey' }
      responses:
        '202':
          description: 已进入 trash 流程
          headers:
            Idempotent-Replay:
              schema: { type: boolean }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceActionResponse' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '404': { $ref: '#/components/responses/V1NotFound' }
        '429': { $ref: '#/components/responses/V1RateLimited' }
        '500': { $ref: '#/components/responses/V1Internal' }

  /v1/instances/{id}/boot:
    parameters:
      - { $ref: '#/components/parameters/V1InstanceID' }
      - { $ref: '#/components/parameters/V1IdempotencyKey' }
    post:
      summary: 启动 VM
      tags: [cloud-gateway]
      security:
        - bearer: []
      responses:
        '202':
          description: 启动请求已下发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceActionResponse' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '404': { $ref: '#/components/responses/V1NotFound' }
        '422': { $ref: '#/components/responses/V1Unprocessable' }
        '429': { $ref: '#/components/responses/V1RateLimited' }

  /v1/instances/{id}/reboot:
    parameters:
      - { $ref: '#/components/parameters/V1InstanceID' }
      - { $ref: '#/components/parameters/V1IdempotencyKey' }
    post:
      summary: 重启 VM
      tags: [cloud-gateway]
      security:
        - bearer: []
      responses:
        '202':
          description: 重启请求已下发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceActionResponse' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '404': { $ref: '#/components/responses/V1NotFound' }
        '429': { $ref: '#/components/responses/V1RateLimited' }

  /v1/instances/{id}/shutdown:
    parameters:
      - { $ref: '#/components/parameters/V1InstanceID' }
      - { $ref: '#/components/parameters/V1IdempotencyKey' }
    post:
      summary: 关机 VM
      tags: [cloud-gateway]
      security:
        - bearer: []
      responses:
        '202':
          description: 关机请求已下发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceActionResponse' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '404': { $ref: '#/components/responses/V1NotFound' }
        '429': { $ref: '#/components/responses/V1RateLimited' }

  /v1/types:
    get:
      summary: 列出可购买套餐
      description: 只返 active 产品；`prices.daily` 在 product.price_daily 非空时输出。
      tags: [cloud-gateway]
      security:
        - bearer: []
      parameters:
        - { $ref: '#/components/parameters/V1Page' }
        - { $ref: '#/components/parameters/V1PageSize' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TypeDTO' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '422': { $ref: '#/components/responses/V1Unprocessable' }
        '429': { $ref: '#/components/responses/V1RateLimited' }

  /v1/regions:
    get:
      summary: 列出可用 region
      description: capabilities 默认 `["instances"]`；status=`available` / `unavailable` / `maintenance`。
      tags: [cloud-gateway]
      security:
        - bearer: []
      parameters:
        - { $ref: '#/components/parameters/V1Page' }
        - { $ref: '#/components/parameters/V1PageSize' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RegionDTO' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '429': { $ref: '#/components/responses/V1RateLimited' }

  /v1/images:
    get:
      summary: 列出可用 OS 镜像
      description: 只返 admin 启用的模板。
      tags: [cloud-gateway]
      security:
        - bearer: []
      parameters:
        - { $ref: '#/components/parameters/V1Page' }
        - { $ref: '#/components/parameters/V1PageSize' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ImageDTO' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '429': { $ref: '#/components/responses/V1RateLimited' }

  /v1/ssh-keys:
    get:
      summary: 列出当前用户的 SSH key
      tags: [cloud-gateway]
      security:
        - bearer: []
      parameters:
        - { $ref: '#/components/parameters/V1Page' }
        - { $ref: '#/components/parameters/V1PageSize' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SSHKeyDTO' }
        '401': { $ref: '#/components/responses/V1Unauthorized' }
        '429': { $ref: '#/components/responses/V1RateLimited' }

components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
    bearer:
      type: http
      scheme: bearer
      bearerFormat: incusadmin-token
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
    VMName:
      in: path
      name: name
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9-]+$' }
    V1InstanceID:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: VM 数据库主键（与 /v1/instances 列表 item.id 对齐）
    V1Page:
      in: query
      name: page
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-indexed 页码
    V1PageSize:
      in: query
      name: page_size
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    V1IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: '^[A-Za-z0-9._-]+$'
      description: |
        同 key 重放 24h 内的同 payload 请求时返缓存响应 + `Idempotent-Replay: true` 头。
        同 key 异 payload → 422 reason=`mismatch`。5xx 不缓存（client 重试拿到恢复后的后端）。
  responses:
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限访问该资源
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: 请求错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StepUpRequired:
      description: 'admin 敏感动作 5 分钟内未 OIDC re-auth；body: { error: step_up_required, redirect: <url> }'
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [step_up_required] }
              redirect: { type: string, format: uri }
    V1Unauthorized:
      description: Bearer token 缺失 / 无效 / 过期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredError' }
    V1Forbidden:
      description: token 有效但无权访问该资源
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredError' }
    V1NotFound:
      description: 资源不存在（或不属于当前 token 持有人）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredError' }
    V1PaymentRequired:
      description: 余额不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredError' }
          example:
            errors:
              - field: balance
                reason: insufficient_balance
                message: balance not enough for daily charge
    V1Unprocessable:
      description: 请求字段校验失败（field/reason 见 body）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredError' }
          examples:
            region_unavailable:
              value:
                errors:
                  - field: region
                    reason: region_unavailable
            unsupported_period:
              value:
                errors:
                  - field: period
                    reason: unsupported
            invalid_idempotency:
              value:
                errors:
                  - field: Idempotency-Key
                    reason: invalid
    V1RateLimited:
      description: 触发限流；带 `Retry-After` + IETF RateLimit 头
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
        RateLimit-Limit:
          schema: { type: integer }
        RateLimit-Remaining:
          schema: { type: integer }
        RateLimit-Reset:
          schema: { type: integer }
          description: 距下次配额刷新的秒数
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredError' }
    V1Internal:
      description: 服务端内部错误（已记 slog.Error）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StructuredError' }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    VM:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        cluster_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        ip: { type: string, nullable: true }
        status:
          type: string
          enum: [creating, running, stopped, suspended, error, deleted, gone]
        cpu: { type: integer }
        memory_mb: { type: integer }
        disk_gb: { type: integer }
        os_image: { type: string }
        node: { type: string }
        rescue_state: { type: string, enum: ['', entering, on, exiting] }
        trashed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    FirewallGroup:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/FirewallRule' }
    FirewallRule:
      type: object
      properties:
        direction: { type: string, enum: [ingress, egress] }
        action: { type: string, enum: [allow, reject, drop] }
        protocol: { type: string, enum: [tcp, udp, icmp4, icmp6, ''] }
        destination_port: { type: string }
        source_cidr: { type: string }
        description: { type: string }
        sort_order: { type: integer }
    NotifyChannel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          type: string
          enum: [dingtalk, feishu, wecom, webhook, smtp]
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotifyChannelCreate:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        kind:
          type: string
          enum: [dingtalk, feishu, wecom, webhook, smtp]
        config:
          type: object
          description: |
            按 kind 不同：
              dingtalk/feishu: { webhook_url, sign_secret? }
              wecom: { webhook_url }
              webhook: { url, method?, bearer?, headers? }
              smtp: { host, port, username, password, from, to[], tls }
        enabled: { type: boolean, default: true }
    AlertRuleCreate:
      type: object
      required: [name, kind, scope_kind, window_seconds, severity]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [imbalance, vm_cpu, vm_mem, vm_disk, vm_down, cluster_node_offline, order_failed, job_failed, balance_low, backup_failed]
        scope_kind:
          type: string
          enum: [global, cluster, vm, user]
        scope_id: { type: integer, format: int64 }
        threshold: { type: number }
        window_seconds: { type: integer, minimum: 30, maximum: 86400 }
        severity:
          type: string
          enum: [info, warning, error, critical]
        channel_ids:
          type: array
          items: { type: integer, format: int64 }
        enabled: { type: boolean }

    # ============ cloud-gateway /v1 schemas（PLAN-053 / INFRA-012） ============
    StructuredError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required: [reason]
            properties:
              field:
                type: string
                description: 出问题的字段名（顶层字段直接用 key，header 用 header 名；空串表示请求级错误）
              reason:
                type: string
                description: 机器可读的错误代码（snake_case），见 README §错误格式
              message:
                type: string
                description: 给人看的描述（可选；运维 / DEBUG 用，不要在 UI 直接显示）
    PaginatedResponse:
      type: object
      required: [data, page, page_size, pages, total]
      properties:
        data:
          type: array
          description: 当前页数据；具体 item schema 由各端点定义
          items: { }
        page:
          type: integer
          minimum: 1
          description: 当前页码（1-indexed）
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        pages:
          type: integer
          minimum: 0
          description: 总页数（ceil(total / page_size)；total=0 时为 0）
        total:
          type: integer
          minimum: 0
    AccountDTO:
      type: object
      required: [id, email, balance, currency]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        balance:
          type: number
          format: double
          description: 当前账户余额；单位 currency（一期固定 USD）
        currency:
          type: string
          enum: [USD]
        estimated_runway_days:
          type: number
          format: double
          nullable: true
          description: |
            按当前 active vm_subscriptions 的日均消耗推算的剩余运行天数。
            算法：daily sub 累加 daily_rate；monthly sub 累加 monthly_rate/30；
            balance / dailyBurn。无 active sub / burn=0 / balance<=0 时省略字段。
    InstanceDTO:
      type: object
      required: [id, label, type, region, image, status, created_at, tags]
      properties:
        id: { type: integer, format: int64 }
        label:
          type: string
          description: 用户可见的 VM 名（对应内部 vms.name）
        type:
          type: integer
          format: int64
          description: 套餐 id（对应 /v1/types 的 id）
        region:
          type: string
          description: cluster 名（对应 /v1/regions 的 id）
        image:
          type: string
          description: OS 镜像 source（如 `ubuntu/24.04/cloud`）
        status:
          type: string
          enum: [pending, creating, running, stopped, rebooting, suspended, deleting, error]
        ip4: { type: string }
        ip6: { type: string }
        created_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }
    TypeDTO:
      type: object
      required: [id, label, slug, vcpus, memory_mb, disk_gb, bandwidth_tb, prices]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        slug:
          type: string
          description: 稳定 slug；跨环境复用比 numeric id 更可靠
        vcpus: { type: integer, minimum: 1 }
        memory_mb: { type: integer, minimum: 1 }
        disk_gb: { type: integer, minimum: 1 }
        bandwidth_tb: { type: integer, minimum: 0 }
        prices:
          type: object
          required: [monthly]
          properties:
            monthly:
              type: number
              format: double
              description: 月单价（USD/月）
            daily:
              type: number
              format: double
              nullable: true
              description: 日单价（USD/天）；PLAN-054 落地后非空 product 才输出
    RegionDTO:
      type: object
      required: [id, country, city, status, capabilities]
      properties:
        id:
          type: string
          description: cluster 名（稳定 slug），创建 instance 时填到 `region` 字段
        country:
          type: string
          description: 国家（cluster 表 country 列；未填时空串）
        city:
          type: string
        status:
          type: string
          enum: [available, unavailable, maintenance]
        capabilities:
          type: array
          description: 该 region 支持的能力（一期固定 `["instances"]`）
          items: { type: string }
    ImageDTO:
      type: object
      required: [id, label, os, version, arch]
      properties:
        id:
          type: string
          description: os_template.slug；创建 instance 时填到 `image` 字段
        label: { type: string }
        os:
          type: string
          description: 操作系统名（从 source `ubuntu/24.04/cloud` 拆出 `ubuntu`）
        version: { type: string }
        arch:
          type: string
          enum: [amd64]
    SSHKeyDTO:
      type: object
      required: [id, label, fingerprint, public_key]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        fingerprint:
          type: string
          description: DB 存储的指纹（通常 `SHA256:xxxx`）
        public_key:
          type: string
          description: 完整公钥字符串（如 `ssh-rsa AAAA... user@host`）
    InstanceCreateRequest:
      type: object
      required: [region, type, image]
      properties:
        region:
          type: string
          description: cluster 名（来自 /v1/regions item.id；必须 status=`available`）
        type:
          oneOf:
            - { type: integer, format: int64, description: 套餐 id }
            - { type: string, description: 套餐 slug 或数字字符串 }
          description: 套餐 id 或 slug
        image:
          type: string
          description: os_template.slug（来自 /v1/images item.id）
        label:
          type: string
          maxLength: 63
          description: VM 名（缺省服务端生成 `vm-<short-uuid>`），字符集 `[a-z0-9-]`
        root_pass:
          type: string
          minLength: 8
          description: root 密码（不传则随机生成并通过 DonePanel 暴露）
        ssh_keys:
          type: array
          description: ssh_keys[]：accept int id 或 string id（两种形态都校验属本人）
          items:
            oneOf:
              - { type: integer, format: int64 }
              - { type: string }
        tags:
          type: array
          items: { type: string }
        user_data:
          type: string
          description: 用户自定义 cloud-init user-data（已 redact 日志输出）
        period:
          type: string
          enum: [daily, monthly]
          default: monthly
          description: 计费周期；必须在 product.period_supported 内。一期 monthly 全产品支持，daily 见 /v1/types prices.daily 非空判断。
    InstanceCreateResponse:
      allOf:
        - $ref: '#/components/schemas/InstanceDTO'
        - type: object
          properties:
            order_id:
              type: integer
              format: int64
              description: 内部订单 id（同步审计用，对 cloud-gateway 不必读）
            job_id:
              type: integer
              format: int64
              description: 异步 provisioning job id；可用 /portal/jobs/{id}/events SSE 跟流
    InstanceActionResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, creating, deleting, bootting, rebooting, shutdowning, running, stopped]
          description: 动作下发后立即返回的状态（trash→deleting，boot→bootting 等）；最终态需轮询
